<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrição enviada | Instituto Educa</title>

  <link rel="stylesheet" href="assets/css/main.css">

  <style>
    .success-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f1e6;
      padding: 24px;
    }

    .success-card {
      max-width: 520px;
      width: 100%;
      background: #fff;
      padding: 36px;
      border-radius: 24px;
      box-shadow: 0 18px 44px rgba(62, 45, 25, 0.12);
      text-align: center;
    }

    .success-card h1 {
      margin-bottom: 16px;
      color: #2f261d;
    }

    .success-card p {
      color: #66594c;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .success-button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 999px;
      background: linear-gradient(135deg, #9c6c35 0%, #7e5428 100%);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .success-button:hover {
      filter: brightness(1.05);
    }
  </style>
</head>

<body>

  <main class="success-page">
    <div class="success-card">
      <h1>Inscrição enviada com sucesso!</h1>

      <p>
        Sua inscrição foi recebida e será analisada pela equipe do Instituto Educa.
        Em breve entraremos em contato, caso necessário.
      </p>

      <a href="index.html" class="success-button">
        Voltar para o início
      </a>
    </div>
  </main>

</body>
</html>
